# WinPython 2026-04 build cycle.
#
# Everything that changes from one cycle to the next lives here, so a new cycle
# is a new file rather than a copy of the workflow.

cycle_dir     = "winpython/portable/cycle_2026_04"
release_level = "b2"

# The build publishes under "<this file's name with dashes><release level>", so
# this cycle releases as 2026-04b1 and a respin is a release_level bump rather
# than a new tag to invent. Add release_tag = "..." to override that.

[pandoc]
source = "https://github.com/jgm/pandoc/releases/download/3.1.9/pandoc-3.1.9-windows-x86_64.zip"
sha256 = "11eb6dbe5286c9e5edb0cca4412e7d99ec6578ec04158b0b7fe11f7fd96688e5"

# The python-build-standalone tarball for each version offered by the workflow.
# ver2 is the WinPython 4-part version; its first 3 parts must appear in src.

[pythons."3.13"]
ver2 = "3.13.15.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.13.15+20260924-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "e42fa944748a50e9ff481cbb817ef8a6e3da6fbcf0cf6f29b554e1acb8c7384d"

[pythons."3.14"]
ver2 = "3.14.7.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.14.7+20260924-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "1493fc4185edf84bbd4305c15c5fbac2d4fcd4ddd7eb6273903669a5d3106178"

[pythons."3.14F"]
ver2 = "3.14.7.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.14.7+20260924-x86_64-pc-windows-msvc-freethreaded-install_only_stripped.tar.gz"
sha  = "fab023c3ab6c67539c31f0204139dc8f23816ff9a316c90ca2632d48865db1f5"

[pythons."3.15"]
ver2 = "3.15.0.5"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.15.0rc2+20260924-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "2a55fddfc90f1340c8149a56bfa3cd0184e4d918ba2f1a392f3d2fec5bf12fc3"

[pythons."3.15F"]
ver2 = "3.15.0.5"
