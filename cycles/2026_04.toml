# WinPython 2026-04 build cycle.
#
# Everything that changes from one cycle to the next lives here, so a new cycle
# is a new file rather than a copy of the workflow.

cycle_dir     = "winpython/portable/cycle_2026_04"
release_level = "b3"

# The build publishes under "<this file's name with dashes><release level>", so
# this cycle releases as 2026-04b1 and a respin is a release_level bump rather
# than a new tag to invent. Add release_tag = "..." to override that.

[pandoc]
source = "https://github.com/jgm/pandoc/releases/download/3.1.9/pandoc-3.1.9-windows-x86_64.zip"
sha256 = "11eb6dbe5286c9e5edb0cca4412e7d99ec6578ec04158b0b7fe11f7fd96688e5"

# The python-build-standalone tarball for each version offered by the workflow.
# ver2 is the WinPython 4-part version; its first 3 parts must appear in src.

[pythons."3.13"]
ver2 = "3.13.16.0"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16+20261001-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "c402eb9a35aba90de319bbc87d23e6d887eca1551a05cfa80775f92dcf3ebc08"

[pythons."3.14"]
ver2 = "3.14.8.0"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.14.8+20261001-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "b7ff8b700995379e425b39abce9b087d84a45aa265ea465c0069c2747ea5b2ea"

[pythons."3.14F"]
ver2 = "3.14.8.0"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.14.8+20261001-x86_64-pc-windows-msvc-freethreaded-install_only_stripped.tar.gz"
sha  = "54e9c8f043096138307b8d6b2c9ac43c19a3815a42f5cfb5b0e3e63cebe4fcbe"

[pythons."3.15"]
ver2 = "3.15.0.5"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.15.0rc2+20261001-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "eeb52e6b8507b118103654b111a662b7b4fd86ea1a56aba840ec84a15b6d8d39"

[pythons."3.15F"]
ver2 = "3.15.0.5"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.15.0rc2+20261001-x86_64-pc-windows-msvc-freethreaded-install_only_stripped.tar.gz"
sha  = "acbce6861f62b9fbcde459433d9e8e4d596c6a81da84632700f0170b6d6c9404"

# Flavors become the job matrix. 2026-02 renamed "free" to "dotf", so this
# varies per cycle too and belongs in the cycle file.

[[flavors]]
name         = "dot"
PANDOC       = "0"
WINPYARCHDET = "64"
formats      = { zip = true, "7z" = false, exe = true }

[[flavors]]
name         = "slim"
PANDOC       = "1"
WINPYARCHDET = "64"
formats      = { zip = false, "7z" = true, exe = true }

[[flavors]]
