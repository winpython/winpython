# WinPython 2026-04 build cycle.
#
# Everything that changes from one cycle to the next lives here, so a new cycle
# is a new file rather than a copy of the workflow.

cycle_dir     = "winpython/portable/cycle_2026_04"
release_level = ""

# The build publishes under "<this file's name with dashes><release level>", so
# this cycle releases as 2026-04b1 and a respin is a release_level bump rather
# than a new tag to invent. Add release_tag = "..." to override that.

[pandoc]
source = "https://github.com/jgm/pandoc/releases/download/3.1.9/pandoc-3.1.9-windows-x86_64.zip"
sha256 = "11eb6dbe5286c9e5edb0cca4412e7d99ec6578ec04158b0b7fe11f7fd96688e5"

# The python-build-standalone tarball for each version offered by the workflow.
# ver2 is the WinPython 4-part version; its first 3 parts must appear in src.

[pythons."3.13"]
ver2 = "3.13.18.0"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18+20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "7369f7a35f261222a6ac8b3a87c1c88eeebee8af945d85346202591a64038dd3"

[pythons."3.14"]
ver2 = "3.14.10.0"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10+20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "c1876a9795d3a94ee49a1499a69cd91e26ca3e2829593f93fa6e4db90d05402b"

[pythons."3.14F"]
ver2 = "3.14.10.0"
