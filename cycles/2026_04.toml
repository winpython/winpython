sha  = "4524041b8b51cae19c5a76929ad9bfa53275b586e9bb47e450f57fffc4e1b0d7"

# Flavors become the job matrix. 2026-02 renamed "free" to "dotf", so this
# varies per cycle too and belongs in the cycle file.

[[flavors]]
name         = "dot"
PANDOC       = "0"
WINPYARCHDET = "64"
formats      = { zip = true, "7z" = false, exe = true }

[[flavors]]
name         = "slim"
PANDOC       = "1"
WINPYARCHDET = "64"
formats      = { zip = false, "7z" = true, exe = true }
post         = "_post1"  # -mx9 re-spin, to fit VirusTotal's 650 MB

[[flavors]]
name         = "whl"
PANDOC       = "0"
WINPYARCHDET = "64"
formats      = { zip = false, "7z" = true, exe = false }

[[flavors]]
name         = "dotf"
PANDOC       = "0"
WINPYARCHDET = "64F"
formats      = { zip = true, "7z" = false, exe = true }

[[flavors]]
