# WinPython 2026-04 build cycle.
#
# Everything that changes from one cycle to the next lives here, so a new cycle
# is a new file rather than a copy of the workflow.

cycle_dir     = "winpython/portable/cycle_2026_04"
release_level = "b1"

[pandoc]
source = "https://github.com/jgm/pandoc/releases/download/3.1.9/pandoc-3.1.9-windows-x86_64.zip"
sha256 = "11eb6dbe5286c9e5edb0cca4412e7d99ec6578ec04158b0b7fe11f7fd96688e5"

# The python-build-standalone tarball for each version offered by the workflow.
# ver2 is the WinPython 4-part version; its first 3 parts must appear in src.

[pythons."3.13"]
ver2 = "3.13.15.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15+20260901-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "63d263ab0162f34a241a56dc5b283c22d6e131f5516117e6a921350c69ba7d4f"

[pythons."3.14"]
ver2 = "3.14.7.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.14.7+20260901-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "ca3c33ca924dfcab3b74205a7a58a88b0255135c53f95497b26b5e60700fd66d"

[pythons."3.14F"]
ver2 = "3.14.7.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.14.7+20260901-x86_64-pc-windows-msvc-freethreaded-install_only_stripped.tar.gz"
sha  = "dced1d9049950d3919d9ff376fbdf881ee9ab653ab95ac70cc626da82aed4d5c"

[pythons."3.15"]
ver2 = "3.15.0.5"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.15.0rc2+20260901-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "eaf415c52191f538c09b6347fb737fcb1255539a59f165bad0cac847600a8490"

[pythons."3.15F"]
ver2 = "3.15.0.5"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.15.0rc2+20260901-x86_64-pc-windows-msvc-freethreaded-install_only_stripped.tar.gz"
sha  = "064767f278b7c7f3340e862256c09a9ce5300af10bbdef27bc53342a88273951"

# Flavors become the job matrix. 2026-02 renamed "free" to "dotf", so this
# varies per cycle too and belongs in the cycle file.

[[flavors]]
name         = "dot"
PANDOC       = "0"
WINPYARCHDET = "64"
formats      = { zip = true, "7z" = false, exe = true }

[[flavors]]
name         = "slim"
PANDOC       = "1"
WINPYARCHDET = "64"
formats      = { zip = false, "7z" = true, exe = true }

[[flavors]]
name         = "whl"
PANDOC       = "0"
WINPYARCHDET = "64"
formats      = { zip = false, "7z" = true, exe = false }

[[flavors]]
name         = "dotf"
PANDOC       = "0"
WINPYARCHDET = "64F"
formats      = { zip = true, "7z" = false, exe = true }

[[flavors]]
