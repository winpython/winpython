sha  = "028ef9fa0ac7ad31553d8d0824a8e48ad52fea1728bd5acb4f60089ab202096a"

[pythons."3.15"]
ver2 = "3.15.2.0"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.15.2+20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "02e532b60e720aa3d77e757c349ae9cc945441c05851fa646336fc9ff0403041"

[pythons."3.15F"]
