sha  = "77375670a76c8c859aa14d8e619917238832fef1e3ad130f13e7dc89a02a87ed"

[pythons."3.15"]
ver2 = "3.15.2.1"
src  = "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.15.2+20261110-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha  = "ecd90d78accb906e3d47f6cdb409a610da10475f94d15ebdd8cb2e0561b71df6"

[pythons."3.15F"]
