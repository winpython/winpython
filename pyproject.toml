[build-system]  # flit_core seems the step after 'setuptools','wheel','build','twine' (see https://github.com/pypa/build/issues/394)
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[project]
name = "wppm"
authors = [
    {name = "Pierre Raybaut"},
    {name = "stonebig"},
]
dependencies = [
    "packaging",
]
requires-python = ">=3.10"
readme = "README_PYPI.md"
license = {file = "LICENSE"}
classifiers=[
    'License :: OSI Approved :: MIT License',
    'Operating System :: MacOS',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: OS Independent',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Programming Language :: Python :: 3',
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development :: Build Tools',
    'Topic :: System :: Software Distribution',
    'Topic :: Software Development :: Widget Sets',
]
dynamic = ["version",]
description="pip companion: extras-aware dependency trees, offline wheelhouses, portable Pythons"
keywords = ["dependency","dependencies","dependency-tree","pipdeptree","extras","requirements","wheelhouse","pip","sbom","portable","windows"]

[project.urls]
Documentation = "https://winpython.github.io/"
Source = "https://github.com/winpython/winpython"
Issues = "https://github.com/winpython/winpython/issues"

[project.scripts]
wppm = "wppm.wppm:main"
